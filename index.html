<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDiary</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 16px; 
            line-height: 1.5;
            padding: 10px;
            margin: 0;
            background-color: #f4f4f4;
        }

        .controls {
            position: sticky;
            top: 0;
            background: #f4f4f4;
            padding: 10px 0;
            z-index: 100;
            border-bottom: 1px solid #ccc;
        }

        input[type="button"] {
            padding: 10px 15px;
            font-size: 14px;
            margin-right: 5px;
            cursor: pointer;
            border: 1px solid #999;
            background: #fff;
            border-radius: 4px;
        }

        input[type="button"]:hover {
            background: #e0e0e0;
        }

        .edit-active {
            background: #ffccbc !important;
            border-color: #ff5722 !important;
            font-weight: bold;
        }

        /* 削除ボタン用のスタイル */
        .btn-delete {
            background-color: #ffebee !important;
            color: #c62828 !important;
        }

        #pagetitle {
            width: 150px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
        }

        #diary-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            margin-top: 10px;
        }

        #diary-table th, #diary-table td {
            border: 1px solid #bbb;
            padding: 12px;
            vertical-align: top;
        }

        [contentEditable="false"] { background-color: #fcfcfc; }
        [contentEditable="true"] {
            background-color: #fff;
            outline: 2px solid #03a9f4;
            outline-offset: -2px;
        }

        .date-col { width: 120px; }
        .content-col { min-height: 100px; }

        #file-input { display: none; }

        /* 画像コンテナおよびリサイズ用スタイル */
        .img-container {
            display: inline-block;
            position: relative;
            margin: 8px 0;
            user-select: none;
            vertical-align: bottom;
            max-width: 100%;
        }

        .img-container img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid transparent;
            box-sizing: border-box;
        }

        .img-container.selected img {
            border: 2px dashed #03a9f4;
        }

        /* リサイズハンドル */
        .resize-handle {
            display: none;
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 12px;
            height: 12px;
            background: #03a9f4;
            border: 1px solid #fff;
            cursor: se-resize;
            z-index: 10;
        }

        .img-container.selected .resize-handle {
            display: block;
        }

        /* 画像用ツールバー */
        .img-toolbar {
            display: none;
            position: absolute;
            top: -36px;
            left: 0;
            background: #333;
            padding: 3px 6px;
            border-radius: 4px;
            z-index: 20;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .img-container.selected .img-toolbar {
            display: flex;
            gap: 4px;
        }

        .img-toolbar button {
            background: #555;
            color: #fff;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
        }

        .img-toolbar button:hover {
            background: #777;
        }

        .img-toolbar button.btn-img-del {
            background: #e53935;
        }
        .img-toolbar button.btn-img-del:hover {
            background: #d32f2f;
        }
    </style>
</head>

<body>
    <div class="controls">
        <input type="button" id="toggle-edit" value="編集モード：OFF" onclick="toggleEditing();">
        <input type="button" value="日記を書く(行追加)" onclick="addRow();">
        <input type="button" value="最新の行を削除" class="btn-delete" onclick="deleteTopRow();">
        
        <input type="button" value="画像を挿入" onclick="triggerFileInput();">
        <input type="button" value="保存" onclick="buttonClick();">
        <input type="button" value="全消去" onclick="clearData();">
        <input type="text" id="pagetitle" value="MyDiary.html">
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div id="textarea">
        <table id="diary-table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>日記の内容</th>
                </tr>
            </thead>
            <tbody id="diary-body"></tbody>
        </table>
    </div>

    <script type="text/javascript">
        const diaryBody = document.getElementById('diary-body');
        const fileInput = document.getElementById('file-input');
        const toggleBtn = document.getElementById('toggle-edit');
        let currentEditingElement = null;
        let isEditable = false;

        // --- IndexedDB ---
        const dbName = "DiaryDB";
        const storeName = "contentStore";
        let db;

        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = (e) => {
            e.target.result.createObjectStore(storeName);
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadData();
        };

        function saveData() {
            if (!db) return;
            const transaction = db.transaction([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            store.put(diaryBody.innerHTML, "mainContent");
        }

        function loadData() {
            const transaction = db.transaction([storeName], "readonly");
            const store = transaction.objectStore(storeName);
            const getRequest = store.get("mainContent");
            getRequest.onsuccess = () => {
                if (getRequest.result) {
                    diaryBody.innerHTML = getRequest.result;
                    attachImageEventListeners();
                } else {
                    addRow();
                }
                updateEditableState();
            };
        }

        setInterval(saveData, 3000);
        window.onbeforeunload = saveData;

        // --- 機能追加: 1番上の行を削除 ---
        function deleteTopRow() {
            const firstRow = diaryBody.firstElementChild;
            if (firstRow) {
                if (confirm("1番上の行（最新の日記）を削除してもよろしいですか？")) {
                    diaryBody.removeChild(firstRow);
                    saveData(); // 削除直後に保存
                }
            } else {
                alert("削除する行がありません。");
            }
        }

        // --- 編集モード制御 ---
        function toggleEditing() {
            isEditable = !isEditable;
            updateEditableState();
            if(!isEditable) saveData();
        }

        function updateEditableState() {
            const cells = diaryBody.querySelectorAll('td');
            cells.forEach(cell => cell.contentEditable = isEditable);
            
            // 編集モードOFFのときは選択解除
            if (!isEditable) {
                deselectAllImages();
                toggleBtn.value = "編集モード：OFF";
                toggleBtn.classList.remove('edit-active');
                currentEditingElement = null;
            } else {
                toggleBtn.value = "編集モード：ON";
                toggleBtn.classList.add('edit-active');
            }
        }

        function addRow() {
            if(!isEditable) toggleEditing();
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td class="date-col" contentEditable="true">${dateStr}</td>
                <td class="content-col" contentEditable="true" onfocus="setCurrentElement(this)"></td>
            `;
            diaryBody.insertBefore(newRow, diaryBody.firstChild);
            newRow.cells[1].focus();
        }

        function setCurrentElement(el) { if(isEditable) currentEditingElement = el; }

        function triggerFileInput() {
            if (!isEditable || !currentEditingElement) {
                alert("編集モードをONにし、入力欄を選択してください。");
                return;
            }
            fileInput.click();
        }

        // --- 画像関連のヘルパー関数 ---
        function deselectAllImages() {
            document.querySelectorAll('.img-container.selected').forEach(c => c.classList.remove('selected'));
        }

        function createResizableImage(src) {
            const container = document.createElement('span');
            container.className = 'img-container';
            container.contentEditable = "false"; // リサイズ操作をスムーズにするためfalseに
            container.style.width = "300px"; // 初期幅

            const img = document.createElement('img');
            img.src = src;

            const handle = document.createElement('div');
            handle.className = 'resize-handle';

            const toolbar = document.createElement('div');
            toolbar.className = 'img-toolbar';
            toolbar.innerHTML = `
                <button onclick="resizeImageContainer(this, '150px')">S</button>
                <button onclick="resizeImageContainer(this, '300px')">M</button>
                <button onclick="resizeImageContainer(this, '500px')">L</button>
                <button onclick="resizeImageContainer(this, '100%')">100%</button>
                <button class="btn-img-del" onclick="deleteImageContainer(this)">削除</button>
            `;

            container.appendChild(toolbar);
            container.appendChild(img);
            container.appendChild(handle);

            setupImageContainerEvents(container, handle);

            return container;
        }

        function resizeImageContainer(btn, size) {
            const container = btn.closest('.img-container');
            if (container) {
                container.style.width = size;
                saveData();
            }
        }

        function deleteImageContainer(btn) {
            const container = btn.closest('.img-container');
            if (container) {
                container.remove();
                saveData();
            }
        }

        function setupImageContainerEvents(container, handle) {
            // 画像クリックで選択状態の切替
            container.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isEditable) return;
                deselectAllImages();
                container.classList.add('selected');
            });

            // ドラッグリサイズ処理
            let startX, startWidth;

            const onMouseMove = (e) => {
                const newWidth = Math.max(50, startWidth + (e.clientX - startX));
                container.style.width = `${newWidth}px`;
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                saveData();
            };

            handle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                if (!isEditable) return;

                startX = e.clientX;
                startWidth = container.offsetWidth;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function attachImageEventListeners() {
            document.querySelectorAll('.img-container').forEach(container => {
                const handle = container.querySelector('.resize-handle');
                if (handle) {
                    setupImageContainerEvents(container, handle);
                }
            });
        }

        // ドキュメント全体クリックで画像の選択を解除
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.img-container')) {
                deselectAllImages();
            }
        });

        // ファイル入力からの画像挿入
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgContainer = createResizableImage(event.target.result);
                currentEditingElement.appendChild(imgContainer);
                saveData();
            };
            reader.readAsDataURL(file);
            fileInput.value = ""; // 入力をリセット
        });

        // クリップボードからの画像ペースト（重複防止対策済み）
        document.addEventListener('paste', function (e) {
            if (!isEditable || !currentEditingElement) return;

            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let hasImage = false;

            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    hasImage = true;
                    e.preventDefault(); // ブラウザ標準の画像ペースト（元サイズ挿入）をキャンセル

                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const imgContainer = createResizableImage(ev.target.result);
                        currentEditingElement.appendChild(imgContainer);
                        saveData();
                    };
                    reader.readAsDataURL(blob);
                    break; // 最初の1枚のみ処理
                }
            }
        });

        function buttonClick(){
            const wasEditable = isEditable;
            if(isEditable) toggleEditing();
            const savehtml = new XMLSerializer().serializeToString(document);
            const blob = new Blob([savehtml], { "type" : "text/html" });
            let link = document.createElement('a'); 
            link.href = URL.createObjectURL(blob);
            link.download = document.getElementById("pagetitle").value;
            link.click(); 
            if(wasEditable) toggleEditing();
        }

        function clearData() {
            if(confirm("すべて消去しますか？")) {
                const transaction = db.transaction([storeName], "readwrite");
                transaction.objectStore(storeName).delete("mainContent");
                diaryBody.innerHTML = "";
            }
        }
    </script>
</body>
</html>
